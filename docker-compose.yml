version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campaignos-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - campaignos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campaignos-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - campaignos-network

networks:
  campaignos-network:
    driver: bridge
